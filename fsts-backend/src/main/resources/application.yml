# =============================================================================
# 冷冻海产品溯源系统 后端主配置
# -----------------------------------------------------------------------------
# 高并发/高可用设计要点：
#   1. server.tomcat.* ：线程池与连接队列按“IO 密集 + 短事务”场景调优；
#   2. HikariCP       ：连接池预热 + 复用 PreparedStatement，降低数据库往返开销；
#   3. jackson        ：Long 主键按业务注解序列化为字符串，日期统一格式；
#   4. fsts.*         ：缓存、限流、溯源码等业务级开关，生产环境通过环境变量覆盖。
# =============================================================================
server:
  port: 8080
  # 优雅停机：收到 SIGTERM 后先处理完在途请求再退出，滚动发布零中断
  shutdown: graceful
  tomcat:
    # 最大工作线程：并发请求数上限（IO 密集场景可适当放大）
    threads:
      max: 400
      min-spare: 40
    # 连接队列：瞬时洪峰时排队而不是直接拒绝
    accept-count: 1000
    max-connections: 10000
    connection-timeout: 5000
    max-http-form-post-size: 2MB
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
    min-response-size: 2048
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: always

spring:
  application:
    name: fsts-trace-backend
  profiles:
    active: dev
  # 优雅停机的最大等待时间
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
  threads:
    virtual:
      enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.fsts.trace.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 单条 SQL 最长 30s，防止慢查询拖垮线程池
    default-statement-timeout: 30
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
      # 逻辑删除仅作用于标注 @TableLogic 的实体（sys_admin / node_enterprise）
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      # K8s 存活/就绪探针：/actuator/health/liveness、/actuator/health/readiness
      probes:
        enabled: true
  health:
    redis:
      # 默认关闭：Redis 属于可降级组件，不应影响服务就绪状态
      enabled: false

# -----------------------------------------------------------------------------
# 业务配置
# -----------------------------------------------------------------------------
fsts:
  jwt:
    # 生产环境务必通过环境变量 FSTS_JWT_SECRET 覆盖（长度 >= 32 字节）
    secret: ${FSTS_JWT_SECRET:fsts-traceability-system-default-secret-key-2026-change-me}
    issuer: fsts
    # Token 有效期（秒），接口文档约定 7200
    expire-seconds: 7200
  redis:
    # 二级缓存 / 分布式锁 / 分布式限流开关；关闭时全部降级为本地实现
    enabled: false
    key-prefix: 'fsts:'
  cache:
    # 本地缓存最大条目数与过期时间
    local-max-size: 10000
    dict-ttl-seconds: 1800
    region-ttl-seconds: 86400
  ratelimit:
    # 消费者端溯源查询限流（单实例令牌桶，Redis 开启时为全局限流）
    public-qps: 200
    public-burst: 400
    # 登录接口限流：防止撞库
    login-qps: 20
    login-burst: 40
  trace:
    # 二维码内容前缀（追溯页面链接）
    qr-base-url: https://fsts.example.com/trace/
    # 查询次数聚合落库间隔（毫秒）：把热点行 UPDATE 从读路径剥离
    query-count-flush-interval-ms: 5000
    # 单次聚合落库的最大条数
    query-count-flush-batch: 500
  batch:
    # 溯源码生成冲突时的最大重试次数（唯一索引兜底）
    trace-code-max-retry: 8

logging:
  level:
    root: info
    com.fsts.trace: info
